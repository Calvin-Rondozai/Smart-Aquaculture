{% extends "base.html" %}
{% block title %}Water Quality · Smart Aquaculture{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Water Quality</h1>
    <p class="page-subtitle">Current readings and historical trends</p>
  </div>
  <div>
    <div class="segmented-control" data-segmented id="range-control">
      <button data-value="24h" class="active">24 Hours</button>
      <button data-value="7d">7 Days</button>
      <button data-value="30d">30 Days</button>
      <button data-value="custom">Custom</button>
    </div>
    <div class="d-flex align-items-center gap-2 mt-2" id="custom-range-row" hidden>
      <input type="date" class="form-control form-control-sm" id="custom-range-start">
      <span class="meta-text">to</span>
      <input type="date" class="form-control form-control-sm" id="custom-range-end">
      <button class="btn-secondary-native" id="custom-range-apply">Apply</button>
    </div>
  </div>
</div>

<div class="row g-4 mb-5" id="current-readings"></div>

<div class="row g-4" id="charts-container">
  <div class="col-lg-6">
    <div class="card card-flat">
      <h2 class="card-title mb-3">Temperature (°C)</h2>
      <div class="chart-scroll"><canvas id="chart-temperature" height="200"></canvas></div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card card-flat">
      <h2 class="card-title mb-3">pH Level</h2>
      <div class="chart-scroll"><canvas id="chart-ph" height="200"></canvas></div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card card-flat">
      <h2 class="card-title mb-3">Dissolved Oxygen (mg/L)</h2>
      <div class="chart-scroll"><canvas id="chart-dissolved_oxygen" height="200"></canvas></div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card card-flat">
      <h2 class="card-title mb-3">Turbidity (NTU)</h2>
      <div class="chart-scroll"><canvas id="chart-turbidity" height="200"></canvas></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='vendor/chartjs/chart.umd.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/water-quality.js') }}"></script>
{% endblock %}
